<!-- ==================== 00 · HERO — REALITY ==================== -->
<section class="hero" id="reality" aria-label="Reality">
  <div class="hero-glow" data-para="6" aria-hidden="true"></div>
  <div class="sky-slot sky-slot--top" data-para="12" aria-hidden="true">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice">
      <g id="skyTopFar" transform="translate(0,-28)" opacity=".5"></g>
      <g id="skyTopNear"></g>
    </svg>
  </div>
  <div class="sky-slot sky-slot--bottom" data-para="18" aria-hidden="true">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice">
      <g id="skyBotFar" transform="translate(0,-28)" opacity=".5"></g>
      <g id="skyBotNear"></g>
    </svg>
  </div>
  <div class="fog fog-a" data-para="9" aria-hidden="true"></div>
  <div class="fog fog-b" data-para="-7" aria-hidden="true"></div>

  <div class="hero-inner" data-para="4">
    <p class="kicker hero-kicker" style="--d:1.15s">A cinematic descent in seven layers</p>
    <h1 class="hero-title" aria-label="Inception">
      <span style="--i:0">I</span><span style="--i:1">N</span><span style="--i:2">C</span><span style="--i:3">E</span><span style="--i:4">P</span><span style="--i:5">T</span><span style="--i:6">I</span><span style="--i:7">O</span><span style="--i:8">N</span>
    </h1>
    <div class="plumb" aria-hidden="true"></div>
    <p class="hero-tag" id="heroTag" style="--d:1.6s">The boundary between reality and memory begins to collapse.</p>
    <a class="enter-btn" href="#story" style="--d:1.9s">Enter the dream</a>
  </div>
  <div class="scroll-cue" aria-hidden="true">Scroll to descend<span class="cue-line"></span></div>
</section>
