<!-- ==================== 02 · DREAM LAYERS ==================== -->
<section class="sec" id="layers" aria-labelledby="layers-h">
  <div class="wrap">
    <!-- SECTION HEADER — KEEP -->
    <div class="sec-head" data-reveal>
      <span class="idx">02</span>
      <span class="idx-rule" aria-hidden="true"></span>
      <span class="idx-label">The Descent</span>
    </div>

    <h2
      class="h2"
      id="layers-h"
      data-reveal
      style="margin-bottom: clamp(3rem, 7vh, 5rem)"
    >
      A world <em>within</em> a world.
    </h2>

    <!-- DREAM LEVELS -->
    <div id="dreamStage">
      <div id="dreamSticky">
        <div id="dreamBackground">
          <img src="/public/assets/img/2laHD.jpg" alt="" />
        </div>

        <div id="dreamHint" aria-hidden="true">SCROLL TO DESCEND</div>
        <div id="dreamLayers">
          <!-- LEVEL 01 -->
          <article class="dream-layer" data-dream-layer="0" style="z-index: 3">
            <div class="dream-frame">
              <img
                class="dream-image"
                src="/public/assets/img/level1.jpg"
                alt="Level 01 — Dream"
              />

              <div class="dream-frame-content">
                <p class="dream-label">LEVEL 01</p>
                <p class="dream-title">Dream</p>
              </div>
            </div>
          </article>

          <!-- LEVEL 02 -->
          <article class="dream-layer" data-dream-layer="1" style="z-index: 2">
            <div class="dream-frame">
              <img
                class="dream-image"
                src="/public/assets/img/level2.png"
                alt="Level 02 — Dream within a Dream"
              />

              <div class="dream-frame-content">
                <p class="dream-label">LEVEL 02</p>
                <p class="dream-title">Dream within a Dream</p>
              </div>
            </div>
          </article>

          <!-- LEVEL 03 -->
          <article class="dream-layer" data-dream-layer="2" style="z-index: 1">
            <div class="dream-frame">
              <img
                class="dream-image"
                src="/public/assets/img/level3.png"
                alt="Level 03 — Dream within a Dream within a Dream"
              />

              <div class="dream-frame-content">
                <p class="dream-label">LEVEL 03</p>
                <p class="dream-title">Dream within a Dream within a Dream</p>
              </div>
            </div>
          </article>
        </div>
      </div>
    </div>
  </div>
</section>
