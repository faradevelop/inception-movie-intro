<!-- ==================== ii · TRAILER — ENTER THE DREAM ==================== -->
<section class="sec" id="trailer" aria-labelledby="trailer-h">
  <div class="wrap">
    <div class="sec-head" data-reveal>
      <span class="idx">ii</span
      ><span class="idx-rule" aria-hidden="true"></span
      ><span class="idx-label">The Trailer</span>
    </div>
    <div class="trailer-head">
      <h2 class="h2" id="trailer-h" data-reveal>Enter the <em>dream.</em></h2>
      <p class="kicker" data-reveal style="--d: 0.1s">Press play — and fall</p>
    </div>
    <div class="trailer-wrap" data-reveal style="--d: 0.15s">
      <div
        class="trailer-frame"
        id="trailerFrame"
        data-embed="https://www.youtube.com/embed/FiM51gvvW_s"
        data-title="Inception — Official Trailer"
      >
        <img
          src="/assets/img/inception-video-poster.jpg"
          alt="Inception movie trailer poster"
          loading="lazy"
          decoding="async"
          onerror="this.style.display = 'none'"
        />
        <button class="trailer-play" id="trailerBtn" aria-label="Play trailer">
          <i aria-hidden="true"></i><span id="trailerLabel">Play trailer</span>
        </button>
      </div>
      <span class="trailer-corner" aria-hidden="true"></span>
    </div>
  </div>
</section>
