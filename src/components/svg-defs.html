<!-- shared SVG defs (rim light, fog) used by the cast silhouettes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A86C" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#C9A86C" stop-opacity=".14"/>
      <stop offset="1" stop-color="#C9A86C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#888" stop-opacity=".3"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeM"><rect x="0" y="0" width="240" height="300" fill="url(#fadeG)"/></mask>
    <radialGradient id="fogG" cx=".5" cy=".42" r=".68">
      <stop offset="0" stop-color="#3A3F4B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3A3F4B" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
